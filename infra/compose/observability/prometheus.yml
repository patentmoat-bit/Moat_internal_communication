# Local scrape config. Production uses the Prometheus Operator, driven by the
# ServiceMonitor and PrometheusRule in infra/helm/moat/templates.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: development

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: moat-api
    metrics_path: /api/metrics
    static_configs:
      # host.docker.internal reaches the API running on the host during
      # development. In-cluster this is service discovery.
      - targets: ["host.docker.internal:8000"]
        labels: { component: api }
