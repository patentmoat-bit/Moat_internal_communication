[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
# The URL is supplied by alembic/env.py from MOAT_MIGRATION_DSN so that
# migrations connect as the schema owner, directly to Postgres, bypassing
# PgBouncer. Transaction-pooled connections cannot hold advisory locks or
# session state that DDL relies on.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
