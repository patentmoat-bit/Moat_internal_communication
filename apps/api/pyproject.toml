[project]
name = "moat-api"
version = "0.1.0"
description = "MOAT API: inventions, prior-art evidence, review and matters"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.38",
    "pydantic[email]>=2.11",
    "pydantic-settings>=2.10",
    "sqlalchemy[asyncio]>=2.0.40",
    "alembic>=1.16",
    "psycopg[binary,pool]>=3.2",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "authlib>=1.6",
    "argon2-cffi>=25.1",
    "itsdangerous>=2.2",
    "structlog>=25.4",
    "opensearch-py>=3.0",
    "aioboto3>=15.0",
    "temporalio>=1.18",
    "pypdf>=6.0",
    "python-docx>=1.2",
    "prometheus-client>=0.23",
    "opentelemetry-api>=1.38",
    "opentelemetry-sdk>=1.38",
    "opentelemetry-instrumentation-fastapi>=0.59b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.59b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.38",
    "model2vec>=0.9.0",
    "jellyfish>=1.2.1",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.13",
    "mypy>=1.18",
    "locust>=2.41",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are called in argument defaults by design;
# that is the framework's contract, not a mutable-default bug.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moat_api"]
