# CloudNativePG cluster. Three instances across three zones (design doc §10).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "moat.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.postgres.instances }}
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6

  primaryUpdateStrategy: unsupervised
  # Zone spread: losing one zone must not take a quorum with it.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          cnpg.io/cluster: {{ .Release.Name }}-postgres

  postgresql:
    parameters:
      # Deliberately modest. PgBouncer owns the connection budget; an app that
      # leaks connections must fail here rather than in staging (design doc §9).
      max_connections: "200"
      shared_buffers: "2GB"
      effective_cache_size: "6GB"
      work_mem: "16MB"
      maintenance_work_mem: "512MB"
      random_page_cost: "1.1"           # SSD storage
      # Row-level security is the second isolation layer. Losing it silently
      # would be catastrophic, so it is asserted here as well as in migrations.
      row_security: "on"
      # Slow query visibility without logging patent text.
      log_min_duration_statement: "1000"
      log_statement: "none"
      shared_preload_libraries: "pg_stat_statements"

  {{- if gt (int .Values.postgres.synchronousReplicas) 0 }}
  postgresql_synchronous:
    method: any
    number: {{ .Values.postgres.synchronousReplicas }}
    # dataDurability "required" pauses writes when no healthy standby remains.
    # That is the intended trade: a committed write must survive losing the
    # primary. Weakening it silently would make the RPO target a fiction.
    dataDurability: required
  {{- end }}

  bootstrap:
    initdb:
      database: moat
      owner: moat_owner
      secret: { name: {{ .Values.secrets.database }} }
      # Non-owner, non-BYPASSRLS application role plus least-privilege grants.
      postInitSQL:
        - CREATE ROLE moat_app LOGIN NOBYPASSRLS
        - REVOKE ALL ON SCHEMA public FROM PUBLIC
        - GRANT USAGE ON SCHEMA public TO moat_app

  storage:
    size: {{ .Values.postgres.storage.size }}
    storageClass: {{ .Values.postgres.storage.storageClass }}
  walStorage:
    # WAL on its own volume: a WAL spike must not fill the data volume and
    # take the primary down with it.
    size: 40Gi
    storageClass: {{ .Values.postgres.storage.storageClass }}

  resources:
    requests: { cpu: "2", memory: 8Gi }
    limits: { memory: 8Gi }

  monitoring:
    enablePodMonitor: true

  {{- if .Values.postgres.backup.enabled }}
  backup:
    retentionPolicy: {{ .Values.postgres.backup.retentionPolicy | quote }}
    # Continuous WAL archiving is what makes the 15-minute RPO achievable.
    # Scheduled base backups alone would put the RPO at the backup interval.
    barmanObjectStore:
      destinationPath: {{ .Values.postgres.backup.destinationPath }}
      s3Credentials:
        accessKeyId: { name: {{ .Values.secrets.objectStore }}, key: backup-access-key }
        secretAccessKey: { name: {{ .Values.secrets.objectStore }}, key: backup-secret-key }
      wal:
        compression: gzip
        maxParallel: 4
      data:
        compression: gzip
        immediateCheckpoint: false
        jobs: 2
  {{- end }}
{{- if .Values.postgres.backup.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ .Release.Name }}-postgres-nightly
spec:
  # Base backup nightly; WAL archiving runs continuously between them. A
  # restore replays WAL forward from the most recent base.
  schedule: "0 30 2 * * *"
  backupOwnerReference: self
  cluster: { name: {{ .Release.Name }}-postgres }
  method: barmanObjectStore
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-pgbouncer-note
data:
  README: |
    PgBouncer is deployed by CloudNativePG as a Pooler resource (below) in
    transaction mode.

    Connection budget (design doc §9): PostgreSQL max_connections is 200.
    Reserve 40 for operations, migrations and monitoring. That leaves an
    aggregate 160 server connections across ALL pooler replicas -- divide by
    replica count when setting default_pool_size, because each replica holds
    its own pool and they multiply.
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ .Release.Name }}-pgbouncer
  labels:
    {{- include "moat.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer
spec:
  cluster: { name: {{ .Release.Name }}-postgres }
  instances: 2
  type: rw
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: pgbouncer
    spec:
      containers: []
  pgbouncer:
    # Transaction mode is what gives the pooling ratio, and the reason the
    # application must hold no session state and must not use server-side
    # prepared statements.
    poolMode: transaction
    parameters:
      max_client_conn: "1000"
      # 160 aggregate budget / 2 replicas = 80 per replica, split across
      # pools. Sized below that to leave headroom.
      default_pool_size: "60"
      reserve_pool_size: "10"
      reserve_pool_timeout: "3"
      query_wait_timeout: "15"
      server_idle_timeout: "180"
